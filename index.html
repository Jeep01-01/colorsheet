<script>
const R=1000,C=20;let RH=26,CW=96,HW=46,Z=1;
let cells={},sel={r:0,c:0},rng=null,cache={},fileName='Sheet1';
const $=id=>document.getElementById(id);
const fin=$('fi'),nb=$('nb'),sc=$('sc'),tb=$('tb');
const colN=c=>String.fromCharCode(65+c);
const key=(r,c)=>r+','+c;
const cell=(r,c,mk)=>{let k=key(r,c);if(!cells[k]&&mk)cells[k]={v:''};return cells[k]};
/* ---------- formula engine (own implementation) ---------- */
const ERR=e=>{throw e};
const num=x=>{if(x===''||x==null)return 0;if(typeof x==='boolean')return+x;const n=Number(x);if(isNaN(n))ERR('#VALUE!');return n};
function parseRef(s){const m=/^\$?([A-Za-z]{1,2})\$?(\d+)$/.exec(s);if(!m)ERR('#REF!');let c=0;for(const ch of m[1].toUpperCase())c=c*26+ch.charCodeAt(0)-64;c--;const r=+m[2]-1;if(r<0||r>=R||c<0||c>=C)ERR('#REF!');return[r,c]}
let busy={};
function val(r,c){const k=key(r,c);if(k in cache)return cache[k];if(busy[k])ERR('#CIRC!');const x=cells[k];let out='';
if(x&&x.v!==''){const raw=String(x.v);if(raw[0]==='='){busy[k]=1;try{out=calc(raw.slice(1))}catch(e){out=typeof e==='string'?e:'#ERROR!'}delete busy[k]}
else if(raw.trim()!==''&&!isNaN(raw))out=Number(raw);else out=raw}
cache[k]=out;return out}
function tokenize(s){const re=/\s*(?:(\d+\.?\d*(?:[eE][+-]?\d+)?)|"((?:[^"]|"")*)"|([A-Za-z_][A-Za-z0-9_.]*)\(|(\$?[A-Za-z]{1,2}\$?\d+)|(TRUE|FALSE)|(<=|>=|<>|[-+*\/^&=<>(),%:]))/y;const t=[];let m;re.lastIndex=0;
while(re.lastIndex<s.length&&/\S/.test(s.slice(re.lastIndex))){const p=re.lastIndex;m=re.exec(s);if(!m){if(!/\S/.test(s.slice(p)))break;ERR('#NAME?')}
if(m[1]!==undefined)t.push({t:'n',v:+m[1]});else if(m[2]!==undefined)t.push({t:'s',v:m[2].replace(/""/g,'"')});else if(m[3])t.push({t:'f',v:m[3].toUpperCase()});else if(m[4])t.push({t:'r',v:m[4]});else if(m[5])t.push({t:'n',v:m[5]==='TRUE'});else t.push({t:'o',v:m[6]})}
return t}
const flat=a=>a.flatMap(x=>Array.isArray(x)?x:[x]);
const nums=a=>flat(a).filter(x=>typeof x==='number'||typeof x==='boolean').map(Number);
const crit=(c)=>{if(typeof c==='number')return x=>x===c;const m=/^(<=|>=|<>|<|>|=)?(.*)$/.exec(String(c));const op=m[1]||'=',v=m[2],n=v!==''&&!isNaN(v)?Number(v):v;
return x=>{const a=(typeof n==='number'&&x!==''&&!isNaN(x))?Number(x):(typeof x==='string'?x.toLowerCase():x),b=typeof n==='string'?n.toLowerCase():n;
return op==='='?a===b:op==='<>'?a!==b:op==='<'?a<b:op==='>'?a>b:op==='<='?a<=b:a>=b}};
const FN={SUM:a=>nums(a).reduce((x,y)=>x+y,0),AVERAGE:a=>{const n=nums(a);if(!n.length)ERR('#DIV/0!');return n.reduce((x,y)=>x+y,0)/n.length},
MIN:a=>Math.min(...nums(a)),MAX:a=>Math.max(...nums(a)),COUNT:a=>nums(a).length,COUNTA:a=>flat(a).filter(x=>x!=='').length,
IF:a=>a[0]?(a[1]===undefined?true:a[1]):(a[2]===undefined?false:a[2]),
AND:a=>flat(a).every(Boolean),OR:a=>flat(a).some(Boolean),NOT:a=>!a[0],
ROUND:a=>{const f=10**num(a[1]||0);return Math.round(num(a[0])*f)/f},ABS:a=>Math.abs(num(a[0])),SQRT:a=>{const n=num(a[0]);if(n<0)ERR('#NUM!');return Math.sqrt(n)},POWER:a=>num(a[0])**num(a[1]),
SUMPRODUCT:a=>{const L=a.map(x=>Array.isArray(x)?x:[x]);const n=L[0].length;if(L.some(x=>x.length!==n))ERR('#VALUE!');let s=0;for(let i=0;i<n;i++){let p=1;for(const x of L)p*=(typeof x[i]==='number'?x[i]:0);s+=p}return s},
SUMIF:a=>{const f=crit(a[1]),r=flat([a[0]]),s=a[2]?flat([a[2]]):r;return r.reduce((t,x,i)=>t+(f(x)&&typeof s[i]==='number'?s[i]:0),0)},
COUNTIF:a=>flat([a[0]]).filter(crit(a[1])).length,
CONCAT:a=>flat(a).join(''),UPPER:a=>String(a[0]).toUpperCase(),LOWER:a=>String(a[0]).toLowerCase(),LEN:a=>String(a[0]).length,
TODAY:()=>Math.floor(Date.now()/864e5)+25569,PI:()=>Math.PI,MOD:a=>{const d=num(a[1]);if(!d)ERR('#DIV/0!');return num(a[0])-d*Math.floor(num(a[0])/d)}};
function calc(src){const T=tokenize(src);let i=0;const pk=()=>T[i],nx=()=>T[i++],isO=v=>T[i]&&T[i].t==='o'&&T[i].v===v;
const sc1=x=>Array.isArray(x)?x[0]:x;
function cmp(){let a=cat();while(T[i]&&T[i].t==='o'&&['=','<>','<','>','<=','>='].includes(T[i].v)){const o=nx().v;let b=cat();a=sc1(a);b=sc1(b);if(typeof a==='string'&&typeof b==='string'){a=a.toLowerCase();b=b.toLowerCase()}
a=o==='='?a==b:o==='<>'?a!=b:o==='<'?a<b:o==='>'?a>b:o==='<='?a<=b:a>=b}return a}
function cat(){let a=add();while(isO('&')){nx();a=String(sc1(a))+String(sc1(add()))}return a}
function add(){let a=mul();while(isO('+')||isO('-')){const o=nx().v,b=mul();a=o==='+'?num(sc1(a))+num(sc1(b)):num(sc1(a))-num(sc1(b))}return a}
function mul(){let a=pow();while(isO('*')||isO('/')){const o=nx().v,b=num(sc1(pow()));if(o==='/'){if(b===0)ERR('#DIV/0!');a=num(sc1(a))/b}else a=num(sc1(a))*b}return a}
function pow(){let a=un();while(isO('^')){nx();a=num(sc1(a))**num(sc1(un()))}return a}
function un(){if(isO('-')){nx();return-num(sc1(un()))}if(isO('+')){nx();return un()}let a=prim();while(isO('%')){nx();a=num(sc1(a))/100}return a}
function prim(){const t=nx();if(!t)ERR('#VALUE!');
if(t.t==='n'||t.t==='s')return t.v;
if(t.t==='r'){const[r,c]=parseRef(t.v);if(isO(':')){nx();const t2=nx();if(!t2||t2.t!=='r')ERR('#REF!');const[r2,c2]=parseRef(t2.v);const o=[];for(let y=Math.min(r,r2);y<=Math.max(r,r2);y++)for(let x=Math.min(c,c2);x<=Math.max(c,c2);x++)o.push(val(y,x));return o}return val(r,c)}
if(t.t==='f'){const args=[];if(!isO(')')){do{if(isO(','))nx();args.push(cmp())}while(isO(','))}if(!isO(')'))ERR('#NAME?');nx();const f=FN[t.v];if(!f)ERR('#NAME?');
if(['IF','ROUND','ABS','SQRT','POWER','NOT','UPPER','LOWER','LEN','MOD'].includes(t.v))return f(args.map(sc1));return f(args)}
if(t.t==='o'&&t.v==='('){const a=cmp();if(!isO(')'))ERR('#VALUE!');nx();return a}
ERR('#VALUE!')}
const res=cmp();if(i<T.length)ERR('#VALUE!');return Array.isArray(res)?res[0]:res}
/* ---------- number formatting ---------- */
const SYM={cur:'$',eur:'€',gbp:'£'},MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtV(v,x){const f=x&&x.f||'gen',d=x&&x.d;if(typeof v==='boolean')return v?'TRUE':'FALSE';if(typeof v!=='number'||f==='txt')return String(v);
const L=(n,mn,mx)=>n.toLocaleString('en-US',{minimumFractionDigits:mn,maximumFractionDigits:mx}),p2=n=>String(n).padStart(2,'0');
switch(f){case'num':return L(v,d??2,d??2);case'int':return L(v,d??0,d??0);
case'cur':case'eur':case'gbp':return(v<0?'-':'')+SYM[f]+L(Math.abs(v),d??2,d??2);
case'pct':return(v*100).toFixed(d??2)+'%';case'sci':return v.toExponential(d??2);
case'date':case'dmy':case'long':{const dt=new Date(Math.round((v-25569)*864e5));if(isNaN(dt))return String(v);const y=dt.getUTCFullYear(),m=dt.getUTCMonth(),dd=dt.getUTCDate();return f==='date'?y+'-'+p2(m+1)+'-'+p2(dd):f==='dmy'?p2(dd)+'/'+p2(m+1)+'/'+y:dd+' '+MN[m]+' '+y}
case'time':{const t=Math.round(((v%1)+1)%1*1440);return p2(Math.floor(t/60)%24)+':'+p2(t%60)}
default:return d!=null?v.toFixed(d):String(+v.toPrecision(12))}}
const zOf=x=>{const f=x.f||'gen',d=x.d,dz=n=>n>0?'.'+'0'.repeat(n):'';
return f==='num'?'#,##0'+dz(d??2):f==='int'?'#,##0'+dz(d??0):SYM[f]?'"'+SYM[f]+'"#,##0'+dz(d??2):f==='pct'?'0'+dz(d??2)+'%':f==='sci'?'0'+dz(d??2)+'E+00':f==='date'?'yyyy-mm-dd':f==='dmy'?'dd/mm/yyyy':f==='long'?'d mmm yyyy':f==='time'?'hh:mm':f==='txt'?'@':d!=null?'0'+dz(d):null};
function fromZ(z){if(!z||z==='General')return{};const d=(z.split('.')[1]||'').replace(/[^0]/g,'').length;
if(/%/.test(z))return{f:'pct',d};if(/E\+/i.test(z))return{f:'sci',d};
if(!/[#0]/.test(z)){if(/h/i.test(z)&&!/[yd]/i.test(z))return{f:'time'};if(/dd?\/mm/i.test(z))return{f:'dmy'};if(/mmm/i.test(z))return{f:'long'};if(/[yd]/i.test(z))return{f:'date'}}
if(/€/.test(z))return{f:'eur',d};if(/£/.test(z))return{f:'gbp',d};if(/\$/.test(z))return{f:'cur',d};if(/#,##0/.test(z))return{f:d?'num':'int',d};if(/^0/.test(z))return{d};return{}}
function cstyle(x,v,z){x=x||{};let s='';if(x.b)s+='font-weight:700;';if(x.i)s+='font-style:italic;';if(x.u||x.s)s+='text-decoration:'+(x.u?'underline ':'')+(x.s?'line-through':'')+';';if(x.bg)s+='background:'+x.bg+';';if(x.fc)s+='color:'+x.fc+';';if(x.ff)s+='font-family:'+x.ff+';';if(x.fs)s+='font-size:'+x.fs*z+'px;';
if(x.wr)s+='white-space:normal;word-break:break-word;line-height:1.1;';if(x.bd)s+='box-shadow:inset 0 0 0 1px #222;';if(x.va)s+='vertical-align:'+x.va+';';
return s+'text-align:'+(x.al||(typeof v==='number'?'right':(/^#/.test(v)?'center':'left')))}
/* ---------- rendering (virtualised) ---------- */
let first=-1,last=-1;
function render(force){const h=sc.clientHeight||600;const f=Math.max(0,Math.floor(sc.scrollTop/RH)-8),l=Math.min(R,f+Math.ceil(h/RH)+16);if(!force&&f===first&&l===last)return;first=f;last=l;
let s='<colgroup><col style="width:'+HW+'px">'+('<col style="width:'+CW+'px">').repeat(C)+'</colgroup><thead><tr><th></th>';for(let c=0;c<C;c++)s+='<th>'+colN(c)+'</th>';s+='</tr></thead><tbody>';
if(f)s+='<tr style="height:'+f*RH+'px"><td colspan="'+(C+1)+'" style="border:0"></td></tr>';
for(let r=f;r<l;r++){s+='<tr><th>'+(r+1)+'</th>';for(let c=0;c<C;c++){const x=cells[key(r,c)],v=val(r,c);let cl='';if(sel.r===r&&sel.c===c)cl='s';else if(inR(r,c))cl='r';
s+='<td data-r="'+r+'" data-c="'+c+'" class="'+cl+'" style="'+cstyle(x,v,Z)+'">'+esc(fmtV(v,x))+'</td>'}s+='</tr>'}
if(l<R)s+='<tr style="height:'+(R-l)*RH+'px"><td colspan="'+(C+1)+'" style="border:0"></td></tr>';tb.innerHTML=s+'</tbody>';}
const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const inR=(r,c)=>rng&&r>=rng.r1&&r<=rng.r2&&c>=rng.c1&&c<=rng.c2;
const refresh=()=>{cache={};render(true);upd();refObjs()};
sc.addEventListener('scroll',()=>render());
function upd(){const x=cell(sel.r,sel.c);syncTb(x);nb.value=rng&&(rng.r1!==rng.r2||rng.c1!==rng.c2)?colN(rng.c1)+(rng.r1+1)+':'+colN(rng.c2)+(rng.r2+1):colN(sel.c)+(sel.r+1);fin.value=x?x.v:'';$('nf').value=x&&x.f||'gen';
let t=0,n=0;eachSel((r,c)=>{const v=val(r,c);if(typeof v==='number'){t+=v;n++}});$('sum').textContent=n>1?'Sum: '+(+t.toFixed(6))+'  Avg: '+ +(t/n).toFixed(6)+'  Count: '+n:''}
function eachSel(fn){const g=rng||{r1:sel.r,r2:sel.r,c1:sel.c,c2:sel.c};for(let r=g.r1;r<=g.r2;r++)for(let c=g.c1;c<=g.c2;c++)fn(r,c)}
/* ---------- interaction ---------- */
let anchor=null,endp=null,drag=false,moved=false,wasSame=false,selMode=false;

else{o.w=Math.max(30,od.ow+dx);o.h=Math.max(20,od.oh+dy);od.d.style.width=o.w*Z+'px';od.d.style.height=o.h*Z+'px'}});
addEventListener('pointerup',()=>{if(od&&od.m==='rz'&&od.o.k==='chart')renderObjs();od=null});
$('pic').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,320/im.width);addObj({k:'img',src:fr.result,w:im.width*k,h:im.height*k})};im.src=fr.result};fr.readAsDataURL(f)});
function doInsert(v){if(!v)return;if(v==='pic'){$('pic').click();return}
if(['bar','linec','pie'].includes(v)){let g=curRng();if(g.r1===g.r2&&g.c1===g.c2)g=usedRange();const a=prompt('Chart data range\n(first row = series names, first column = labels):',colN(g.c1)+(g.r1+1)+':'+colN(g.c2)+(g.r2+1));if(!a)return;const p=a.toUpperCase().split(':');
try{const A=parseRef(p[0]),B=p[1]?parseRef(p[1]):A;addObj({k:'chart',kind:v==='linec'?'line':v,g:{r1:Math.min(A[0],B[0]),r2:Math.max(A[0],B[0]),c1:Math.min(A[1],B[1]),c2:Math.max(A[1],B[1])},w:400,h:270})}catch(_){alert('Invalid range')}return}
addObj({k:'shape',kind:v,w:v==='line'?220:140,h:v==='line'?20:110})}
/* ---------- demo data ---------- */
[['Item','Qty','Price','Total'],['Apples',10,1.5,'=B2*C2'],['Bread',3,2.25,'=B3*C3'],['Milk',6,0.99,'=B4*C4'],['Grand total','','','=SUM(D2:D4)'],['Check (SUMPRODUCT)','','','=SUMPRODUCT(B2:B4,C2:C4)'],['Status','','','=IF(D5>20,"Over budget","OK")']].forEach((row,r)=>row.forEach((v,c)=>{if(v!=='')cells[key(r,c)]={v:String(v)}}));
for(let c=0;c<4;c++){Object.assign(cells[key(0,c)],{b:1,bg:'#c4b5fd',fc:'#3b0764'})}[1,2,3,4].forEach(r=>{cells[key(r,3)].f='cur';cells[key(r,3)].bg='#d1fae5'});cells[key(2-1,2)].f='cur';cells[key(2,2)].f='cur';cells[key(3,2)].f='cur';
render(true);upd();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
